# Local development stack. Production runs the same image on ECS Fargate (see docs/specs/S2-foundation.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dropship
      POSTGRES_PASSWORD: dropship
      POSTGRES_DB: dropship
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropship"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  temporal:
    # Dev server with the Web UI on :8233. State is in memory and resets on restart.
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]

  ollama:
    # Fallback model. Pull it once: docker compose exec ollama ollama pull "$OLLAMA_MODEL"
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    profiles: [llm]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: &docker-urls
      DATABASE_URL: postgresql+asyncpg://dropship:dropship@postgres:5432/dropship
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment: *docker-urls
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      temporal: {condition: service_started}

  worker:
    build: .
    command: ["python", "-m", "dropship.worker"]
    env_file: .env
    environment: *docker-urls
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}

volumes:
  postgres:
  ollama:
